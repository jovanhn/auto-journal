<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Golf · Insights</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#16181D}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F4F2; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #16181D; overflow: hidden">
  <div style="padding: 16px 20px 12px; display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-bottom: 1px solid #E2E3E0">
    <a href="Main.dc.html" aria-label="Back to garage" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <div style="font-size: 20px; font-weight: 600">Golf</div>
      <div style="font-size: 13px; color: #5B606B">Insights · 2026</div>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: #16181D; color: #FFFFFF; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 12px; color: #C9CCD3">Total spent</div>
        <div style="font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums">€2,148</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E3E0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 12px; color: #5B606B">Avg per month</div>
        <div style="font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums">€215</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E3E0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 12px; color: #5B606B">Car value</div>
        <div style="font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums">€8,500</div>
        <div style="font-size: 11px; color: #5B606B">Purchase price</div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E3E0; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 12px; color: #5B606B">Distance</div>
        <div style="font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums">13,120 km</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2E3E0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-size: 15px; font-weight: 600">By month</div>
        <div style="font-size: 12px; color: #5B606B">Peak: Sep · €436</div>
      </div>
      <div role="img" aria-label="Monthly spending January to October 2026, peaks in March and September" style="height: 170px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; align-items: end; border-bottom: 1px solid #E2E3E0">
        <div style="height: 58px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 48px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 154px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 52px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 61px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 55px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 59px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 51px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 160px; background: #C9D4F4; border-radius: 4px 4px 0 0"></div>
        <div style="height: 90px; background: {{accent}}; border-radius: 4px 4px 0 0"></div>
      </div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 8px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: #5B606B; text-align: center; margin-top: -6px">
        <span>J</span><span>F</span><span>M</span><span>A</span><span>M</span><span>J</span><span>J</span><span>A</span><span>S</span><span style="color: #16181D">O</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E2E3E0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="font-size: 15px; font-weight: 600">By category</div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Fuel</span><span style="font-variant-numeric: tabular-nums"><span style="color: #5B606B">55% · </span>€1,172</span></div>
        <div style="height: 8px; background: #EDEEEB; border-radius: 4px"><div style="width: 55%; height: 8px; background: {{accent}}; border-radius: 4px"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Tires</span><span style="font-variant-numeric: tabular-nums"><span style="color: #5B606B">18% · </span>€380</span></div>
        <div style="height: 8px; background: #EDEEEB; border-radius: 4px"><div style="width: 18%; height: 8px; background: {{accent}}; border-radius: 4px"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Insurance</span><span style="font-variant-numeric: tabular-nums"><span style="color: #5B606B">14% · </span>€310</span></div>
        <div style="height: 8px; background: #EDEEEB; border-radius: 4px"><div style="width: 14%; height: 8px; background: {{accent}}; border-radius: 4px"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Service</span><span style="font-variant-numeric: tabular-nums"><span style="color: #5B606B">7% · </span>€145</span></div>
        <div style="height: 8px; background: #EDEEEB; border-radius: 4px"><div style="width: 7%; height: 8px; background: {{accent}}; border-radius: 4px"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Parking &amp; tolls</span><span style="font-variant-numeric: tabular-nums"><span style="color: #5B606B">4% · </span>€86</span></div>
        <div style="height: 8px; background: #EDEEEB; border-radius: 4px"><div style="width: 4%; height: 8px; background: {{accent}}; border-radius: 4px"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 14px"><span>Other</span><span style="font-variant-numeric: tabular-nums"><span style="color: #5B606B">2% · </span>€55</span></div>
        <div style="height: 8px; background: #EDEEEB; border-radius: 4px"><div style="width: 2%; height: 8px; background: {{accent}}; border-radius: 4px"></div></div>
      </div>
    </div>
  </div>

  <nav aria-label="Vehicle sections" style="height: 72px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E3E0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="Expenses.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #5B606B">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>
      Expenses
    </a>
    <a href="Insights.dc.html" aria-current="page" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: {{accent}}">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
      Insights
    </a>
    <a href="Planned.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: #5B606B">
      <svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      Planned
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#1F4FD8&quot;,&quot;options&quot;:[&quot;#1F4FD8&quot;,&quot;#0F766E&quot;,&quot;#B4490F&quot;,&quot;#16181D&quot;]},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#1F4FD8' };
  }
}
</script>

</body></html>
