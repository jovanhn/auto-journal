name: Team 1

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message to print"
        required: false
        default: "Hello from Team 1"
  push:
    branches: [master]
    paths:
      - ".github/workflows/team-1.yml"

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print info
        run: |
          echo "${{ github.event.inputs.message || 'Hello from Team 1' }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"

      - name: List project files
        run: ls -la
