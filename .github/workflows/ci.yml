name: CI

on:
  pull_request:
  push:
    branches: [main]

# On PR branches a new push cancels the in-progress run. On main every push runs to the end (queued),
# because each push may carry a deploy: a newer push without backend changes would otherwise cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7.0.1
      # docs/** is intentionally not part of any filter: docs-only changes trigger no build jobs.
      # A change to this workflow runs (and on main, deploys) every component it builds (ADR 0022).
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'contracts/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'contracts/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
            e2e:
              - 'e2e/**'
              - 'frontend/**'
              - 'backend/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'

  contracts:
    name: Contracts (Redocly lint)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: contracts/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: contracts/pnpm-lock.yaml
      - run: make contracts-lint

  backend:
    name: Backend (mvn verify)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Unit + Testcontainers integration tests, Spring Modulith verification, ktlint.
      - run: make be-check

  frontend:
    name: Frontend (lint, typecheck, test, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Version script tests
        working-directory: .
        run: make scripts-test
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate API client
        run: pnpm gen
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Real Supabase Auth (ADR 0015): the frontend build and fixtures sign in, the backend verifies tokens.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: autojournal
          POSTGRES_USER: autojournal
          POSTGRES_PASSWORD: autojournal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autojournal -d autojournal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -q -DskipTests package
      - name: Build frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install Playwright
        working-directory: e2e
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # webServer reuses the Postgres service container and starts the backend jar + vite preview.
      - name: Run E2E tests
        working-directory: e2e
        run: pnpm test
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # --- Delivery (ADR 0016): main only, after the gate is green. Not part of ci-ok. ---

  backend-image:
    name: Publish backend image (GHCR)
    needs: [changes, ci-ok]
    # !cancelled(): ci-ok runs with always(), so skipped jobs upstream must not skip this one.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      # Full history and tags: scripts/version.sh counts the commits since the backend/vX.Y.0 tag (ADR 0023).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: image
        env:
          RELEASE_BUILD: 'true'
        run: |
          version="$(sh scripts/version.sh backend)"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          LATEST="${IMAGE%:*}:latest"
          VERSIONED="${IMAGE%:*}:${VERSION}"
          docker build -f backend/Dockerfile \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$IMAGE" -t "$VERSIONED" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$VERSIONED"
          docker push "$LATEST"

  backend-deploy:
    name: Deploy backend (Render)
    needs: backend-image
    if: ${{ !cancelled() && needs.backend-image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      # Render pulls exactly the image built from this commit (not :latest).
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.backend-image.outputs.image }}
        run: curl -fsS -X POST -G --data-urlencode "imgURL=$IMAGE" "$RENDER_DEPLOY_HOOK_URL" > /dev/null

  # Frontend delivery (ADR 0022): GitHub Actions builds, Cloudflare only hosts (Worker static assets).
  frontend-deploy:
    name: Deploy frontend (Cloudflare)
    needs: [changes, ci-ok]
    # !cancelled(): ci-ok runs with always(), so skipped jobs upstream must not skip this one.
    if: >-
      !cancelled() && needs.ci-ok.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # Optional: `false` hides the build-info footer on Settings (specs/app-versioning.md, decision 8a).
      VITE_SHOW_BUILD_INFO: ${{ vars.VITE_SHOW_BUILD_INFO }}
      # vite.config.ts fails the build instead of shipping a -dev or 0.0.0-local version (ADR 0023).
      RELEASE_BUILD: 'true'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check production configuration
        run: |
          missing=""
          for name in VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in the GitHub environment 'production':$missing"
            exit 1
          fi
        working-directory: .
      # Full history and tags: scripts/version.sh counts the commits since the frontend/vX.Y.0 tag (ADR 0023).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate API client
        run: pnpm gen
      - name: Build
        run: pnpm build
      # Wrangler is not a project dependency (ADR 0017/0022); pinned here and updated by hand.
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4.155.0 deploy

  # The only job to mark as a required status check. Skipped jobs count as success.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, contracts, backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done
