version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /frontend
      - /contracts
      - /e2e
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # typescript-eslint does not support TypeScript 7 yet; drop this once it does.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # A JDK major upgrade must also change java.version and CI's setup-java, so it is a deliberate
    # change (with an ADR), not a Dependabot bump. Patch/minor image updates still come through.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
