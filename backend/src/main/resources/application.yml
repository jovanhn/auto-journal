# Common configuration for all profiles. Profile files:
#   application-local.yml  default; env vars with defaults matching docker-compose.yml
#   application-test.yml   tests (Testcontainers provides the datasource)
#   application-prod.yml   env vars only, no defaults for secrets
spring:
  application:
    name: autojournal
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: autojournal
  security:
    oauth2:
      resourceserver:
        # Supabase Auth (ADR 0013, 0015): ES256-signed access tokens, keys from the project's JWKS.
        jwt:
          issuer-uri: ${SUPABASE_URL}/auth/v1
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256
          audiences: authenticated
  flyway:
    schemas: autojournal
    default-schema: autojournal
    create-schemas: true

autojournal:
  # Commit SHA of the build (set by the Docker image, ADR 0016); `local` otherwise. Shown by GET /api/status.
  version: ${APP_VERSION:local}
  # The MCP endpoint's public URL (ADR 0018), published in /.well-known/oauth-protected-resource.
  # Profile prod requires MCP_RESOURCE_URL (https://be-autojournal.skverly.com/mcp).
  mcp:
    resource-url: ${MCP_RESOURCE_URL:http://localhost:8080/mcp}
  # Comma-separated frontend origins allowed to call /api (ADR 0017). Profile local defaults to the Vite ports.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Units of each currency per 1 EUR; fixed, set by the owner (ADR 0014). Changing them needs a redeploy.
  exchange-rates:
    rsd-per-eur: ${EXCHANGE_RATE_RSD_PER_EUR:117.00}
    usd-per-eur: ${EXCHANGE_RATE_USD_PER_EUR:1.10}
  # Data limits (BR-L1…L8, specs/data-limits.md). Numbers ≥ 1; earliest-date an ISO date not in the future.
  limits:
    vehicles-per-user: ${LIMIT_VEHICLES_PER_USER:10}
    journal-entries-per-vehicle: ${LIMIT_JOURNAL_ENTRIES_PER_VEHICLE:3000}
    planned-expenses-per-vehicle: ${LIMIT_PLANNED_EXPENSES_PER_VEHICLE:50}
    issues-per-vehicle: ${LIMIT_ISSUES_PER_VEHICLE:200}
    max-odometer-km: ${LIMIT_MAX_ODOMETER_KM:2000000}
    max-recurrence-months: ${LIMIT_MAX_RECURRENCE_MONTHS:120}
    earliest-date: ${LIMIT_EARLIEST_DATE:1900-01-01}
    planned-years-ahead: ${LIMIT_PLANNED_YEARS_AHEAD:10}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
