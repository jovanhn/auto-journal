# Local development. Defaults match docker-compose.yml and .env.example.
# The repo-root .env (if present) provides SUPABASE_URL and other overrides; real env vars still win.
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autojournal}
    username: ${DB_USERNAME:autojournal}
    password: ${DB_PASSWORD:autojournal}
