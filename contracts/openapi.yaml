openapi: 3.0.3
info:
  title: autojournal API
  version: 0.1.0
  description: |
    Contract-first API for autojournal. Backend interfaces and the frontend client are generated
    from this file. See contracts/AGENTS.md for conventions and the breaking-change policy.

    Every operation requires a Supabase Auth access token (ADR 0013): `Authorization: Bearer <jwt>`.
  license:
    name: Proprietary
    url: https://example.com/license
servers:
  - url: /
    description: Same origin as the frontend (proxied to the backend locally)
security:
  - bearerAuth: []
tags:
  - name: users
    description: Users module (user profile and preferences)
  - name: vehicles
    description: Vehicles module (the user's cars)
  - name: expenses
    description: Expenses module (what each car costs)
  - name: planning
    description: Planning module (a car's upcoming costs and the 12-month projection)
  - name: issues
    description: Issues module (problems with a car to keep an eye on until fixed, ADR 0021)
  - name: system
    description: Service status for clients that wait for a sleeping backend (implemented in `shared`, ADR 0018)

paths:
  /api/status:
    get:
      tags: [system]
      operationId: getStatus
      summary: Check that the backend is up (public, no database access)
      description: |
        Clients use it for the wake-up protocol (specs/assistant-mcp.md): call it with a 5 s timeout; on a
        timeout, a connection error, a 502/503/504 or a body that is not this JSON, wait 50 s and retry,
        at most 3 times.
      security: []
      responses:
        '200':
          description: The backend is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
  /api/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Get the signed-in user's profile (created on first call)
      responses:
        '200':
          description: The user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      operationId: updateMe
      summary: Change the signed-in user's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: List the signed-in user's vehicles, oldest first (not paginated)
      responses:
        '200':
          description: The user's vehicles in the order they were added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Add a vehicle
      description: |
        A user has at most *vehicles per user* vehicles (BR-L1, configurable, default 10), checked by the server.
        Adding one more responds `409` with the limit in `detail`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: The created vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/vehicles/{vehicleId}:
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Get a vehicle
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Replace a vehicle's data
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
      responses:
        '200':
          description: The updated vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [vehicles]
      operationId: deleteVehicle
      summary: Delete a vehicle and everything recorded for it
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{vehicleId}/journal:
    get:
      tags: [expenses]
      operationId: listJournal
      summary: List a vehicle's whole journal, all years
      description: |
        Every expense and log entry of the vehicle (BR-J1, BR-J6), without totals: the client filters by period,
        type and search and sums `Expense.displayAmount` (BR-J7). At most *journal entries per vehicle* entries
        (BR-L2), so not paginated.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle's expenses and log entries of all years
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{vehicleId}/expenses:
    get:
      tags: [expenses]
      operationId: listExpenses
      summary: List a vehicle's expenses of one calendar year, with yearly and monthly totals
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: year
          in: query
          required: false
          description: Calendar year, 1900 … current year (upper bound checked by the server). Defaults to the current year.
          schema:
            type: integer
            format: int32
            minimum: 1900
      responses:
        '200':
          description: The year's expenses, newest date first, and totals in the display currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseYear'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [expenses]
      operationId: createExpense
      summary: Add an expense to a vehicle
      description: |
        A vehicle has at most *journal entries per vehicle* journal entries, expenses and log entries together
        (BR-L2, configurable, default 3,000), checked by the server. Adding one more responds `409` with the
        limit in `detail`.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
      responses:
        '201':
          description: The created expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/vehicles/{vehicleId}/insights:
    get:
      tags: [expenses]
      operationId: getVehicleInsights
      summary: A vehicle's figures for one calendar year plus its lifetime car value, distance and cost per km
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: year
          in: query
          required: false
          description: Calendar year, 1900 … current year (upper bound checked by the server). Defaults to the current year.
          schema:
            type: integer
            format: int32
            minimum: 1900
      responses:
        '200':
          description: The vehicle's insights, all money in the display currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleInsights'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{vehicleId}/insights/all-time:
    get:
      tags: [expenses]
      operationId: getVehicleAllTimeInsights
      summary: A vehicle's figures over all time (BR-I9) plus its car value, distance and cost per km
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle's all-time insights, all money in the display currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleAllTimeInsights'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/expenses/summary:
    get:
      tags: [expenses]
      operationId: getExpenseSummary
      summary: This year's totals across all the user's vehicles (Garage)
      responses:
        '200':
          description: The current year's total, average per month and per-vehicle totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/expenses/{expenseId}:
    get:
      tags: [expenses]
      operationId: getExpense
      summary: Get an expense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '200':
          description: The expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [expenses]
      operationId: updateExpense
      summary: Replace an expense's data
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
      responses:
        '200':
          description: The updated expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [expenses]
      operationId: deleteExpense
      summary: Delete an expense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/expenses/{expenseId}/log-entry:
    post:
      tags: [expenses]
      operationId: convertExpenseToLogEntry
      summary: Turn an expense into a log entry, removing its cost
      description: |
        The entry keeps its id and place in the journal (BR-J5). Date, odometer and note are replaced from the
        request (like an edit); amount, currency, rate snapshot, category and approximate are deleted. The result
        must follow BR-J2 (`400`, field `note`). Converting is not adding, so the journal entry limit does not
        apply (BR-L2, BR-L4).
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogEntryRequest'
      responses:
        '200':
          description: The log entry, with the expense's id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{vehicleId}/log-entries:
    post:
      tags: [expenses]
      operationId: createLogEntry
      summary: Add a log entry (an odometer reading, condition or observation without a cost) to a vehicle
      description: |
        A log entry needs an odometer reading, a note or both (BR-J2; `400`, field `note`). It never counts in
        totals; its odometer reading counts for the current odometer and distances (BR-J3). A vehicle has at most
        *journal entries per vehicle* journal entries, expenses and log entries together (BR-L2, configurable,
        default 3,000), checked by the server. Adding one more responds `409` with the limit in `detail`.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogEntryRequest'
      responses:
        '201':
          description: The created log entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/log-entries/{logEntryId}:
    get:
      tags: [expenses]
      operationId: getLogEntry
      summary: Get a log entry
      description: An expense's id is not a log entry (`404`), like another user's (BR-U2).
      parameters:
        - $ref: '#/components/parameters/LogEntryId'
      responses:
        '200':
          description: The log entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [expenses]
      operationId: updateLogEntry
      summary: Replace a log entry's data
      description: Omitting `odometer` or `note` clears it; the result must follow BR-J2 (`400`, field `note`).
      parameters:
        - $ref: '#/components/parameters/LogEntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogEntryRequest'
      responses:
        '200':
          description: The updated log entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [expenses]
      operationId: deleteLogEntry
      summary: Delete a log entry
      parameters:
        - $ref: '#/components/parameters/LogEntryId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/log-entries/{logEntryId}/expense:
    post:
      tags: [expenses]
      operationId: convertLogEntryToExpense
      summary: Turn a log entry into an expense
      description: |
        The entry keeps its id and place in the journal (BR-J5). All fields are replaced from the request (like an
        edit), the expense follows BR-E1…E6 and takes a rate snapshot now (BR-C4). Converting is not adding, so
        the journal entry limit does not apply (BR-L2, BR-L4).
      parameters:
        - $ref: '#/components/parameters/LogEntryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
      responses:
        '200':
          description: The expense, with the log entry's id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/vehicles/{vehicleId}/planned-expenses:
    get:
      tags: [planning]
      operationId: listPlannedExpenses
      summary: List a vehicle's planned expenses, earliest due first, with the 12-month projection
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle's planned expenses and the projection in the display currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedExpenseList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [planning]
      operationId: createPlannedExpense
      summary: Plan an upcoming expense for a vehicle
      description: |
        A vehicle has at most *planned expenses per vehicle* planned expenses (BR-L3, configurable, default 50),
        checked by the server. Adding one more responds `409` with the limit in `detail`.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannedExpenseRequest'
      responses:
        '201':
          description: The created planned expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedExpense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/planned-expenses/next-due:
    get:
      tags: [planning]
      operationId: listNextDuePlannedExpenses
      summary: The earliest planned expense of each of the user's vehicles (Garage)
      responses:
        '200':
          description: One entry per vehicle that has planned expenses; vehicles without plans are missing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NextDuePlannedExpense'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/planned-expenses/{plannedExpenseId}:
    put:
      tags: [planning]
      operationId: updatePlannedExpense
      summary: Replace a planned expense's data
      parameters:
        - $ref: '#/components/parameters/PlannedExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlannedExpenseRequest'
      responses:
        '200':
          description: The updated planned expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedExpense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [planning]
      operationId: deletePlannedExpense
      summary: Delete a planned expense without paying it
      parameters:
        - $ref: '#/components/parameters/PlannedExpenseId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/planned-expenses/{plannedExpenseId}/pay:
    post:
      tags: [planning]
      operationId: payPlannedExpense
      summary: Mark a planned expense as paid, creating the expense
      description: |
        Creates the expense from the request (BR-PL2) with the plan's category (the request's `category` is
        ignored), then removes a one-time plan or moves a recurring plan's due date forward by its recurrence
        (BR-PL3), in one transaction. The expense is not linked to the plan afterwards. When the vehicle already
        has *journal entries per vehicle* journal entries (BR-L2), it responds `409` and the plan is unchanged.
      parameters:
        - $ref: '#/components/parameters/PlannedExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
      responses:
        '201':
          description: The created expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/vehicles/{vehicleId}/issues:
    get:
      tags: [issues]
      operationId: listIssues
      summary: List a vehicle's issues, open and resolved
      description: |
        Not paginated: a vehicle has at most *issues per vehicle* issues (BR-L8). Both lists are in BR-IS6 order.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle's open and resolved issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [issues]
      operationId: createIssue
      summary: Note an open issue for a vehicle
      description: |
        A vehicle has at most *issues per vehicle* issues, open and resolved together (BR-L8, configurable,
        default 200), checked by the server. Adding one more responds `409` with the limit in `detail`.
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '201':
          description: The created (open) issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/issues/{issueId}:
    get:
      tags: [issues]
      operationId: getIssue
      summary: Get one issue
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: The issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [issues]
      operationId: updateIssue
      summary: Replace an issue's editable fields
      description: |
        Open or resolved (BR-IS5). Never changes the status, outcome or resolved date. For a resolved issue the
        date noticed must stay on or before the resolved date (`400`, field `noticedOn`).
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueRequest'
      responses:
        '200':
          description: The updated issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [issues]
      operationId: deleteIssue
      summary: Delete an issue (open or resolved); nothing else changes
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/issues/{issueId}/resolve:
    post:
      tags: [issues]
      operationId: resolveIssue
      summary: Resolve an open issue as fixed or gone
      description: |
        BR-IS3: `resolvedOn` is not in the future (UTC) and not before the date noticed (`400`, field
        `resolvedOn`). Resolving an issue that is already resolved responds `409`.
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveIssueRequest'
      responses:
        '200':
          description: The resolved issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/issues/{issueId}/reopen:
    post:
      tags: [issues]
      operationId: reopenIssue
      summary: Reopen a resolved issue
      description: |
        BR-IS4: clears the outcome and resolved date and keeps the other fields. Reopening an open issue responds
        `409`.
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '200':
          description: The reopened issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.

  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogEntryId:
      name: logEntryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlannedExpenseId:
      name: plannedExpenseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing, expired or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadRequest:
      description: Invalid request (validation errors are listed in `errors`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Domain rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ServiceStatus:
      type: object
      required: [status, version, startedAt]
      properties:
        status:
          type: string
          enum: [UP]
        version:
          type: string
          description: Commit SHA of the running build, or `local`.
        startedAt:
          type: string
          format: date-time
          description: When this backend instance started.
    ProblemDetail:
      type: object
      description: RFC 9457 problem details, extended with field-level validation errors.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Request field name, as in the request body (e.g. `name`).
        message:
          type: string

    Currency:
      type: string
      enum: [EUR, RSD, USD]
      description: Supported currencies (domain BR-C1).
    UserProfile:
      type: object
      required: [userId, displayCurrency]
      properties:
        userId:
          type: string
          format: uuid
          description: The Supabase Auth user id.
        displayCurrency:
          $ref: '#/components/schemas/Currency'
    UpdateUserProfileRequest:
      type: object
      required: [displayCurrency]
      properties:
        displayCurrency:
          $ref: '#/components/schemas/Currency'

    Money:
      type: object
      description: An amount in a currency (domain BR-C1). `amount` is a decimal string, so no precision is lost.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^\d{1,10}(\.\d{1,2})?$'
          example: '8500.00'
        currency:
          $ref: '#/components/schemas/Currency'

    Vehicle:
      type: object
      required:
        - id
        - nickname
        - make
        - model
        - year
        - plate
        - odometerAtStart
        - currentOdometer
        - purchasePrice
        - value
        - purchaseDate
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
        plate:
          type: string
          nullable: true
        odometerAtStart:
          type: integer
          format: int32
          description: Kilometres when the vehicle was added.
        currentOdometer:
          type: integer
          format: int32
          description: max(odometer at start, expense odometer readings) (BR-V5).
        purchasePrice:
          $ref: '#/components/schemas/Money'
        value:
          description: Car value (= purchase price, BR-V7) converted to the user's display currency with the price's rate snapshot.
          allOf:
            - $ref: '#/components/schemas/Money'
        purchaseDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    CreateVehicleRequest:
      type: object
      required: [nickname, make, model, year, odometerAtStart, purchasePrice, purchaseDate]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
          description: Unique among the user's vehicles (case-insensitive, trimmed).
        make:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
        model:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
        year:
          type: integer
          format: int32
          minimum: 1900
          description: At most next calendar year (checked by the server).
        plate:
          type: string
          maxLength: 20
          nullable: true
          description: Optional; blank is stored as null.
        odometerAtStart:
          type: integer
          format: int32
          minimum: 0
          description: At most *max odometer* km (BR-L5, configurable, default 2,000,000; checked by the server).
        purchasePrice:
          $ref: '#/components/schemas/Money'
        purchaseDate:
          type: string
          format: date
          description: |
            Not in the future and not before *earliest date* (BR-L7, configurable, default 1900-01-01); checked by
            the server.
    UpdateVehicleRequest:
      description: Same fields as CreateVehicleRequest.
      allOf:
        - $ref: '#/components/schemas/CreateVehicleRequest'

    Category:
      type: string
      enum: [FUEL, SERVICE, REPAIRS, INSURANCE, REGISTRATION_TAX, TIRES, PARKING_TOLLS, OTHER]
      description: Fixed expense categories (BR-E3), shared with planned expenses.
    ExpenseRequest:
      type: object
      required: [date, amount, category]
      properties:
        date:
          type: string
          format: date
          description: |
            Not in the future and not before *earliest date* (BR-L7, configurable, default 1900-01-01); checked by
            the server. May be before the purchase date.
        amount:
          $ref: '#/components/schemas/Money'
        category:
          $ref: '#/components/schemas/Category'
        odometer:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Optional reading in km, at most *max odometer* (BR-L5, configurable, default 2,000,000; checked by the
            server); may be lower than the current odometer (BR-E4).
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Optional; trimmed, blank is stored as null.
        approximate:
          type: boolean
          default: false
          description: |
            The amount, the date or both are a best guess (BR-E6). Only marks the expense; it counts in every total
            like any other. Omitted = false (also on update, which replaces all fields).
    Expense:
      type: object
      required: [id, vehicleId, date, amount, displayAmount, category, odometer, note, approximate, createdAt]
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        amount:
          description: The amount as entered, in its original currency.
          allOf:
            - $ref: '#/components/schemas/Money'
        displayAmount:
          description: The amount converted with its rate snapshot to the user's display currency (BR-C4, BR-C6).
          allOf:
            - $ref: '#/components/schemas/Money'
        category:
          $ref: '#/components/schemas/Category'
        odometer:
          type: integer
          format: int32
          nullable: true
        note:
          type: string
          nullable: true
        approximate:
          type: boolean
          description: The amount, the date or both are a best guess (BR-E6).
        createdAt:
          type: string
          format: date-time
    ExpenseYear:
      type: object
      description: |
        One vehicle's journal of a calendar year: its expenses and log entries (BR-J1). All totals are in the
        display currency and come from expenses only (BR-I1, BR-J3).
      required: [year, firstYear, yearTotal, monthTotals, expenses, logEntries]
      properties:
        year:
          type: integer
          format: int32
        firstYear:
          type: integer
          format: int32
          description: |
            Year of the vehicle's earliest journal entry (expense or log entry), or the current year if it has none.
        yearTotal:
          $ref: '#/components/schemas/Money'
        monthTotals:
          type: array
          description: Totals for January … December.
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/Money'
        expenses:
          type: array
          description: Newest date first; for the same date, newest created first.
          items:
            $ref: '#/components/schemas/Expense'
        logEntries:
          type: array
          description: |
            The year's log entries, newest date first; for the same date, newest created first. Merge them with
            `expenses` by `date`, then `createdAt`, for the journal timeline (BR-J1).
          items:
            $ref: '#/components/schemas/LogEntry'
    Journal:
      type: object
      description: |
        One vehicle's whole journal: its expenses and log entries of all years (BR-J1, BR-J6). No totals; amounts
        are in the display currency in `Expense.displayAmount` (BR-J7).
      required: [firstYear, expenses, logEntries]
      properties:
        firstYear:
          type: integer
          format: int32
          description: |
            Year of the vehicle's earliest journal entry (expense or log entry), or the current year if it has none.
        expenses:
          type: array
          description: All years, newest date first; for the same date, newest created first.
          items:
            $ref: '#/components/schemas/Expense'
        logEntries:
          type: array
          description: |
            All years, newest date first; for the same date, newest created first. Merge them with `expenses` by
            `date`, then `createdAt`, for the journal timeline (BR-J1).
          items:
            $ref: '#/components/schemas/LogEntry'
    LogEntryRequest:
      type: object
      required: [date]
      description: |
        A log entry needs `odometer`, `note` or both (BR-J2); the server checks it (`400`, field `note`). A note
        that is blank after trimming counts as none.
      properties:
        date:
          type: string
          format: date
          description: |
            Not in the future and not before *earliest date* (BR-L7, configurable, default 1900-01-01); checked by
            the server. May be before the purchase date.
        odometer:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Optional reading in km, at most *max odometer* (BR-L5, configurable, default 2,000,000; checked by the
            server); may be lower than the current odometer and never lowers it (BR-J3).
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Optional condition or observation; trimmed, blank is stored as null.
    LogEntry:
      type: object
      description: A journal entry without a cost (BR-J2); never counts in totals (BR-J3).
      required: [id, vehicleId, date, odometer, note, createdAt]
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        odometer:
          type: integer
          format: int32
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ExpenseSummary:
      type: object
      description: The current year across all the user's vehicles, in the display currency (BR-I6).
      required: [year, total, averagePerMonth, vehicles]
      properties:
        year:
          type: integer
          format: int32
        total:
          $ref: '#/components/schemas/Money'
        averagePerMonth:
          description: total ÷ months elapsed this year, including the current month.
          allOf:
            - $ref: '#/components/schemas/Money'
        vehicles:
          type: array
          description: Vehicles with expenses this year; a vehicle that is missing has a total of 0.
          items:
            $ref: '#/components/schemas/VehicleExpenseTotal'
    VehicleInsights:
      type: object
      description: One vehicle's year figures (BR-I1…I3) and lifetime figures (BR-I4, BR-V7), in the display currency.
      required:
        - year
        - firstYear
        - total
        - averagePerMonth
        - monthTotals
        - categories
        - carValue
        - distanceKm
        - costPerKm
        - yearDistanceKm
        - yearCostPerKm
      properties:
        year:
          type: integer
          format: int32
        firstYear:
          type: integer
          format: int32
          description: Year of the vehicle's earliest expense, or the current year if it has none.
        total:
          $ref: '#/components/schemas/Money'
        averagePerMonth:
          description: total ÷ months elapsed in the year (12 for a past year, through the current month for the current year).
          allOf:
            - $ref: '#/components/schemas/Money'
        monthTotals:
          type: array
          description: Totals for January … December.
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/Money'
        categories:
          type: array
          description: Categories with expenses in the year, highest total first (BR-I2).
          items:
            $ref: '#/components/schemas/CategoryTotal'
        carValue:
          description: Car value (= purchase price, BR-V7) at its rate snapshot.
          allOf:
            - $ref: '#/components/schemas/Money'
        distanceKm:
          type: integer
          format: int32
          description: Current odometer − odometer at start.
        costPerKm:
          description: (all expenses + purchase price) ÷ distance driven, lifetime (BR-I4); null when the distance is 0.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
        yearDistanceKm:
          type: integer
          format: int32
          nullable: true
          description: Distance driven in the year (BR-I7); null when no expense in the year has an odometer reading.
        yearCostPerKm:
          description: The year's total ÷ distance driven in the year (BR-I8); null when that distance is null or 0.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
    VehicleAllTimeInsights:
      type: object
      description: One vehicle's figures over all time (BR-I9) and its lifetime figures (BR-I4, BR-V7), in the display currency.
      required:
        - firstYear
        - total
        - averagePerMonth
        - yearTotals
        - categories
        - carValue
        - distanceKm
        - costPerKm
      properties:
        firstYear:
          type: integer
          format: int32
          description: Year of the vehicle's earliest expense, or the current year if it has none.
        total:
          $ref: '#/components/schemas/Money'
        averagePerMonth:
          description: total ÷ months from the month of the earlier of the purchase date and the first expense through the current month.
          allOf:
            - $ref: '#/components/schemas/Money'
        yearTotals:
          type: array
          description: One total per calendar year, firstYear … current year, oldest first.
          minItems: 1
          items:
            $ref: '#/components/schemas/YearTotal'
        categories:
          type: array
          description: Categories with expenses, highest total first (BR-I2).
          items:
            $ref: '#/components/schemas/CategoryTotal'
        carValue:
          description: Car value (= purchase price, BR-V7) at its rate snapshot.
          allOf:
            - $ref: '#/components/schemas/Money'
        distanceKm:
          type: integer
          format: int32
          description: Current odometer − odometer at start.
        costPerKm:
          description: (all expenses + purchase price) ÷ distance driven, lifetime (BR-I4); null when the distance is 0.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
    YearTotal:
      type: object
      required: [year, total]
      properties:
        year:
          type: integer
          format: int32
        total:
          $ref: '#/components/schemas/Money'
    CategoryTotal:
      type: object
      required: [category, total, sharePercent]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        total:
          $ref: '#/components/schemas/Money'
        sharePercent:
          type: integer
          format: int32
          description: Share of the year total in whole percent, rounded half-up.
    VehicleExpenseTotal:
      type: object
      required: [vehicleId, total]
      properties:
        vehicleId:
          type: string
          format: uuid
        total:
          $ref: '#/components/schemas/Money'

    PlannedExpenseRequest:
      type: object
      required: [category, estimatedAmount, dueDate]
      properties:
        category:
          $ref: '#/components/schemas/Category'
        estimatedAmount:
          $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
          description: |
            May be in the past (the plan is then overdue, BR-PL5); at most *planned years ahead* years after today
            (BR-L7, configurable, default 10; checked by the server, UTC).
        recurrenceMonths:
          type: integer
          format: int32
          minimum: 1
          nullable: true
          description: |
            Null (or absent) = one-time; otherwise it repeats every N months (12 = yearly), N at most *max
            recurrence months* (BR-L6, configurable, default 120; checked by the server).
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Optional; trimmed, blank is stored as null.
    PlannedExpense:
      type: object
      required:
        - id
        - vehicleId
        - category
        - estimatedAmount
        - displayAmount
        - dueDate
        - recurrenceMonths
        - note
        - dueSoon
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/Category'
        estimatedAmount:
          description: The estimate as entered, in its original currency.
          allOf:
            - $ref: '#/components/schemas/Money'
        displayAmount:
          description: The estimate converted with the current configured rates to the display currency (BR-C5).
          allOf:
            - $ref: '#/components/schemas/Money'
        dueDate:
          type: string
          format: date
        recurrenceMonths:
          type: integer
          format: int32
          nullable: true
          description: Null = one-time; otherwise every N months.
        note:
          type: string
          nullable: true
        dueSoon:
          type: boolean
          description: Due within the next 30 days or overdue (BR-PL6), by the server's date (UTC).
        createdAt:
          type: string
          format: date-time
    PlannedExpenseList:
      type: object
      required: [projectionTotal, items]
      properties:
        projectionTotal:
          description: Expected cost of the next 12 calendar months, from the current one, in the display currency (BR-I5).
          allOf:
            - $ref: '#/components/schemas/Money'
        items:
          type: array
          description: Earliest due date first; for the same date, oldest created first.
          items:
            $ref: '#/components/schemas/PlannedExpense'
    NextDuePlannedExpense:
      type: object
      required: [vehicleId, plannedExpense]
      properties:
        vehicleId:
          type: string
          format: uuid
        plannedExpense:
          $ref: '#/components/schemas/PlannedExpense'

    IssueSeverity:
      type: string
      description: How serious an issue is (BR-IS1); open issues are listed Urgent, Fix soon, Watch (BR-IS6).
      enum: [WATCH, FIX_SOON, URGENT]
    IssueSource:
      type: string
      description: Where an issue came from (BR-IS1).
      enum: [NOTICED, MECHANIC, WARNING_LIGHT]
    IssueOutcome:
      type: string
      description: How an issue was resolved (BR-IS3); GONE = went away by itself, not an issue.
      enum: [FIXED, GONE]
    IssueStatus:
      type: string
      enum: [OPEN, RESOLVED]
    IssueRequest:
      type: object
      required: [title, severity, source, noticedOn]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 60
          pattern: '.*\S.*'
          description: Trimmed.
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        source:
          $ref: '#/components/schemas/IssueSource'
        noticedOn:
          type: string
          format: date
          description: |
            Not in the future and not before *earliest date* (BR-L7, configurable, default 1900-01-01); for a
            resolved issue on or before its resolved date (BR-IS5). Checked by the server (UTC).
        odometer:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: |
            Optional reading in km, at most *max odometer* (BR-L5, configurable, default 2,000,000; checked by the
            server). For information only; never changes the current odometer (BR-IS2). Omitted = cleared.
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Optional; trimmed, blank is stored as null. Omitted = cleared.
    ResolveIssueRequest:
      type: object
      required: [outcome, resolvedOn]
      properties:
        outcome:
          $ref: '#/components/schemas/IssueOutcome'
        resolvedOn:
          type: string
          format: date
          description: Not in the future (UTC) and not before the date noticed (BR-IS3); checked by the server.
    Issue:
      type: object
      description: A problem with a vehicle to keep an eye on (BR-IS1); never counts in totals or the odometer (BR-IS2).
      required:
        - id
        - vehicleId
        - title
        - severity
        - source
        - noticedOn
        - odometer
        - note
        - status
        - outcome
        - resolvedOn
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        title:
          type: string
        severity:
          $ref: '#/components/schemas/IssueSeverity'
        source:
          $ref: '#/components/schemas/IssueSource'
        noticedOn:
          type: string
          format: date
        odometer:
          type: integer
          format: int32
          nullable: true
        note:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/IssueStatus'
        outcome:
          description: Set only when `status` is RESOLVED.
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IssueOutcome'
        resolvedOn:
          type: string
          format: date
          nullable: true
          description: Set only when `status` is RESOLVED.
        createdAt:
          type: string
          format: date-time
    IssueList:
      type: object
      required: [open, resolved]
      properties:
        open:
          type: array
          description: Severity (Urgent, Fix soon, Watch), then date noticed (newest first), then created (newest first).
          items:
            $ref: '#/components/schemas/Issue'
        resolved:
          type: array
          description: Resolved date (newest first), then created (newest first).
          items:
            $ref: '#/components/schemas/Issue'
