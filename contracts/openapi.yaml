openapi: 3.0.3
info:
  title: autojournal API
  version: 0.1.0
  description: |
    Contract-first API for autojournal. Backend interfaces and the frontend client are generated
    from this file. See contracts/AGENTS.md for conventions and the breaking-change policy.

    Every operation requires a Supabase Auth access token (ADR 0013): `Authorization: Bearer <jwt>`.
  license:
    name: Proprietary
    url: https://example.com/license
servers:
  - url: /
    description: Same origin as the frontend (proxied to the backend locally)
security:
  - bearerAuth: []
tags:
  - name: users
    description: Users module (user profile and preferences)
  - name: vehicles
    description: Vehicles module (the user's cars)

paths:
  /api/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Get the signed-in user's profile (created on first call)
      responses:
        '200':
          description: The user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      operationId: updateMe
      summary: Change the signed-in user's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: List the signed-in user's vehicles, oldest first (not paginated)
      responses:
        '200':
          description: The user's vehicles in the order they were added
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Add a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: The created vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/vehicles/{vehicleId}:
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Get a vehicle
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Replace a vehicle's data
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVehicleRequest'
      responses:
        '200':
          description: The updated vehicle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [vehicles]
      operationId: deleteVehicle
      summary: Delete a vehicle and everything recorded for it
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.

  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing, expired or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadRequest:
      description: Invalid request (validation errors are listed in `errors`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Domain rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ProblemDetail:
      type: object
      description: RFC 9457 problem details, extended with field-level validation errors.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Request field name, as in the request body (e.g. `name`).
        message:
          type: string

    Currency:
      type: string
      enum: [EUR, RSD, USD]
      description: Supported currencies (domain BR-C1).
    UserProfile:
      type: object
      required: [userId, displayCurrency]
      properties:
        userId:
          type: string
          format: uuid
          description: The Supabase Auth user id.
        displayCurrency:
          $ref: '#/components/schemas/Currency'
    UpdateUserProfileRequest:
      type: object
      required: [displayCurrency]
      properties:
        displayCurrency:
          $ref: '#/components/schemas/Currency'

    Money:
      type: object
      description: An amount in a currency (domain BR-C1). `amount` is a decimal string, so no precision is lost.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^\d{1,10}(\.\d{1,2})?$'
          example: '8500.00'
        currency:
          $ref: '#/components/schemas/Currency'

    Vehicle:
      type: object
      required:
        - id
        - nickname
        - make
        - model
        - year
        - plate
        - odometerAtStart
        - currentOdometer
        - purchasePrice
        - value
        - purchaseDate
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
        plate:
          type: string
          nullable: true
        odometerAtStart:
          type: integer
          format: int32
          description: Kilometres when the vehicle was added.
        currentOdometer:
          type: integer
          format: int32
          description: max(odometer at start, expense odometer readings) (BR-V5).
        purchasePrice:
          $ref: '#/components/schemas/Money'
        value:
          description: Car value (= purchase price, BR-V7) converted to the user's display currency with the price's rate snapshot.
          allOf:
            - $ref: '#/components/schemas/Money'
        purchaseDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
    CreateVehicleRequest:
      type: object
      required: [nickname, make, model, year, odometerAtStart, purchasePrice, purchaseDate]
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
          description: Unique among the user's vehicles (case-insensitive, trimmed).
        make:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
        model:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
        year:
          type: integer
          format: int32
          minimum: 1900
          description: At most next calendar year (checked by the server).
        plate:
          type: string
          maxLength: 20
          nullable: true
          description: Optional; blank is stored as null.
        odometerAtStart:
          type: integer
          format: int32
          minimum: 0
        purchasePrice:
          $ref: '#/components/schemas/Money'
        purchaseDate:
          type: string
          format: date
          description: Not in the future (checked by the server).
    UpdateVehicleRequest:
      description: Same fields as CreateVehicleRequest.
      allOf:
        - $ref: '#/components/schemas/CreateVehicleRequest'
